services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Doctrine repositories, factories and the scheduler implement the Persister / Provider /
    # Factory / ExpressionScheduler interfaces of etl-core. Symfony aliases each interface to its
    # single implementation in these namespaces. Entities, API payloads, resources and state classes
    # are registered separately (or not at all).
    BoutDeCode\ETLBundle\Core\Infrastructure\:
        resource: '../../Core/Infrastructure/'
        exclude: '../../Core/Infrastructure/{Api,Persistence/ORM/Entity}/'

    BoutDeCode\ETLBundle\Run\Infrastructure\:
        resource: '../../Run/Infrastructure/'
        exclude: '../../Run/Infrastructure/{Api,Persistence/ORM/Entity}/'

    BoutDeCode\ETLBundle\Run\Application\:
        resource: '../../Run/Application/'

    BoutDeCode\ETLBundle\Statistics\Infrastructure\:
        resource: '../../Statistics/Infrastructure/'
        exclude: '../../Statistics/Infrastructure/Persistence/ORM/Entity/'

    # Executable steps provided by this bundle. The core tags them (boutdecode_etl_core.executable_step).
    BoutDeCode\ETLBundle\ETL\Infrastructure\Step\:
        resource: '../../ETL/Infrastructure/Step/'

    # The implementations of the etl-core interfaces are aliased with #[AsAlias] on each class.
    # Not left to the core: its alias compiler pass skips them, since the core registers every
    # interface of its namespace as an abstract definition.

    # Required by this bundle's ConsoleCommandExecutorStep, which autowires the console application,
    # a service Symfony does not register on its own. Applications may override this definition.
    # Not autoconfigured: the application implements ResetInterface and resetting it
    # resets the services again, which would recurse forever.
    Symfony\Bundle\FrameworkBundle\Console\Application:
        autoconfigure: false
        arguments: ['@kernel']
